<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The World</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230e4a63'/%3E%3Cpath d='M16 6l7 10-7 10-7-10z' fill='%23e7b54a'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1420;
        color: #e8f1ff;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        left: 24px;
        bottom: 20px;
        pointer-events: none;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
        opacity: 0.75;
      }
      #hud strong {
        display: block;
        font-size: 28px;
        letter-spacing: 0.2em;
        opacity: 1;
      }
      #gate {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        text-align: center;
        padding: 24px;
        background: #0b1420;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"><strong>The World</strong><span id="renderer-label">loading</span></div>
    <div id="gate">
      <div>
        <h1>The World</h1>
        <p>The World runs in a desktop browser. Open this page on a computer to play.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
